    <script>
        (function () {
            // Page load fade-in
            window.addEventListener('load', function () {
                document.documentElement.classList.add('page-loaded');
            });

            // Safety net: if the 'load' event is ever delayed or a CDN
            // resource fails/hangs, don't leave the page invisible forever
            // (html has opacity:0 by default until 'page-loaded' is added).
            setTimeout(function () {
                document.documentElement.classList.add('page-loaded');
            }, 1500);

            var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            AOS.init({
                duration: 900,
                easing: 'ease-out-cubic',
                once: true,
                offset: 80,
                disable: prefersReducedMotion
            });

            // Sticky Header — this page has no hero section to observe
            // via IntersectionObserver, so toggle purely on scroll position.
            var stickyHeader = document.getElementById('stickyHeader');
            var SCROLL_THRESHOLD = 150; // show sticky header past ~100-200px

            if (stickyHeader) {
                function updateStickyHeader() {
                    stickyHeader.classList.toggle('is-visible', window.scrollY > SCROLL_THRESHOLD);
                }

                window.addEventListener('scroll', updateStickyHeader, { passive: true });
                updateStickyHeader(); // set correct state on initial load (e.g. after a refresh mid-scroll)
            }
        })(); // <-- IIFE must actually be invoked, or none of the above ever runs
    </script>
